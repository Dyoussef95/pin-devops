name: TaskFlow - CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Run automated tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

  sonar:
    name: SonarQube Cloud analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  snyk:
    name: Snyk dependency security scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Snyk CLI
        run: npm install --global snyk

      - name: Scan dependencies
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --severity-threshold=high

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [test, sonar, snyk]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t taskflow:${{ github.sha }} .



  deploy-local:
    name: Deploy to local Ubuntu VM
    runs-on: [self-hosted, Linux, X64, taskflow-local]
    needs: [test, sonar, snyk, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync project files
        run: |
          rsync -rlpt \
            --exclude='.git/' \
            --exclude='.venv/' \
            --exclude='.terraform/' \
            --exclude='terraform.tfstate*' \
            --exclude='*.tfstate*' \
            --exclude='Proyecto_1_TaskFlow.zip' \
            ./ /home/ubuntu/pin-devops/

      - name: Initialize Terraform
        run: terraform -chdir=/home/ubuntu/pin-devops init -input=false

      - name: Apply Terraform configuration
        run: terraform -chdir=/home/ubuntu/pin-devops apply -auto-approve -input=false

      - name: Verify TaskFlow health
        run: |
          for attempt in $(seq 1 12); do
            if curl --fail --silent http://localhost:5001/health; then
              echo
              echo "TaskFlow is healthy."
              exit 0
            fi
            sleep 5
          done
          echo "TaskFlow health check failed."
          exit 1